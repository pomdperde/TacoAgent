[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tacoagent"
version = "0.1.0"
description = "A small, extensible agent CLI built with Typer."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langgraph>=0.2",
    "mem0ai>=1.0",
    "python-dotenv>=1.0",
    "qdrant-client>=1.9",
    "rich>=13.0",
    "tavily-python>=0.5",
    "typer>=0.12",
]

[project.scripts]
taco = "tacoagent.cli.app:main"
tacoagent = "tacoagent.cli.app:main"

[project.optional-dependencies]
evaluation = ["deepeval>=4.1,<5", "langsmith>=0.3.13"]
swebench = ["datasets>=2.14", "swebench"]

[tool.hatch.build.targets.wheel]
packages = ["src/tacoagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
